apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-api
  labels: { app: papyrus, component: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: papyrus, component: api } }
  template:
    metadata:
      labels: { app: papyrus, component: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: papyrus/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: papyrus-config }
            - secretRef: { name: papyrus-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-worker
  labels: { app: papyrus, component: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: papyrus, component: worker } }
  template:
    metadata:
      labels: { app: papyrus, component: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: papyrus/worker:latest
          envFrom:
            - configMapRef: { name: papyrus-config }
            - secretRef: { name: papyrus-secrets }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: papyrus-web
  labels: { app: papyrus, component: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: papyrus, component: web } }
  template:
    metadata:
      labels: { app: papyrus, component: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: papyrus/web:latest
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: papyrus-api
spec:
  minAvailable: 1
  selector: { matchLabels: { app: papyrus, component: api } }
